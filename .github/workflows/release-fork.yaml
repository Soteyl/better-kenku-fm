name: Release Fork Build (vX.Y.Z.fN)

on:
  push:
    tags:
      - "v*.*.*.f*"

permissions:
  contents: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch from tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          RELEASE_BRANCH="release/${TAG}"

          if git ls-remote --heads origin "${RELEASE_BRANCH}" | grep -q "${RELEASE_BRANCH}"; then
            echo "Branch ${RELEASE_BRANCH} already exists, skipping."
            exit 0
          fi

          TAG_SHA=$(git rev-parse "refs/tags/${TAG}")
          git branch "${RELEASE_BRANCH}" "${TAG_SHA}"
          git push origin "${RELEASE_BRANCH}"

  build-release:
    needs: create-release-branch
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Fetch bundled optional tools
        env:
          KENKU_BUNDLED_TOOLS_STRICT: "1"
          # Defaults to binaries released from the PyMusicLooper fork.
          # Can be overridden by repo variable KENKU_PYMUSICLOOPER_BASE_URL.
          KENKU_PYMUSICLOOPER_BASE_URL: ${{ vars.KENKU_PYMUSICLOOPER_BASE_URL || 'https://github.com/Soteyl/PyMusicLooper/releases/download/kenku-tools-latest' }}
        run: yarn run bundle:tools

      - name: Build distributables
        run: yarn run make

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/make/**/*.zip
            out/make/**/*.deb
            out/make/**/*.rpm
            out/make/**/*.exe
            out/make/**/*.nupkg
            out/make/**/RELEASES*
            out/make/**/*.dmg
